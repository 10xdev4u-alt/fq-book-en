  ### Bot note (docsify tips):
    If the sidebar shows only one item [Foreword] after local deployment, first check that the JS code block characters are correct, that `loadSidebar: true` is consistent, and clear the browser cache; or try a different browser.
    ```
    <script>
      window.$docsify = {
        name: '',
        repo: '',
      <!-- here -->
        loadSidebar: true
      }
    </script>
    ```
    **Note: `docsify init .` will reformat (initialize) the index.html config file; just run `docsify serve` to deploy.**

