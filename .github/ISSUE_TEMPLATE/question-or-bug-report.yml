name: "Question or Bug Report"
description: "Please fill in the template completely before asking a question or reporting a bug, otherwise your issue may be closed directly."
title: "[Briefly summarize your issue, e.g. empty sidebar after local deployment]"
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Before opening an issue, please confirm all of the following: issues that don't follow the template or lack sufficient detail may be closed directly.**

  - type: dropdown
    id: category
    attributes:
      label: What kind of issue is this? (required)
      options:
        - Local deployment / docsify configuration
        - Git / GitHub related (e.g. fork, sync upstream)
        - Documentation error or suggestion
        - Other
      multiple: false
    validations:
      required: true

  - type: checkboxes
    id: self-check
    attributes:
      label: Self-checks you have already done (check all before submitting)
      description: If you cannot check all of these, complete the corresponding checks before opening the issue.
      options:
        - label: I have carefully read the root README.md and docs/README.md
          required: true
        - label: I have searched closed / open issues and found no matching problem
          required: true
        - label: I have cleared the browser cache / retried in another browser
          required: true
        - label: I have checked the local environment (Node, npm, network, proxy, etc.)
          required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / process (required)
      description: Describe in detail what you did, step by step, until the problem appeared.
      placeholder: |
        1. Clone / fork the repository locally...
        2. Run docsify serve . in the docs directory...
        3. Open http://localhost:3000 in the browser...
    validations:
      required: true

  - type: textarea
    id: result-vs-expected
    attributes:
      label: Actual result vs expected result (required)
      description: Describe what you see now and what the correct behavior should be.
      placeholder: |
        Actual result: e.g. the sidebar only shows "Foreword" and other chapters are missing; or a specific error appears.

        Expected result: e.g. the sidebar should display all chapters normally.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version (required)
      placeholder: e.g. Windows 10 / macOS 14 / Ubuntu 22.04
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version (required)
      placeholder: e.g. Chrome 121 / Edge 120
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version (required, output of node -v)
      placeholder: e.g. v18.19.0
    validations:
      required: true

  - type: input
    id: package-manager
    attributes:
      label: Package manager and version (optional)
      description: If you use npm / pnpm / yarn, please provide the version.
      placeholder: e.g. npm 10.2.0

  - type: dropdown
    id: proxy
    attributes:
      label: Are you using a proxy / VPN?
      options:
        - No
        - Yes (system-level proxy)
        - Yes (browser extension)
        - Yes (VPN / other)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Key error info / logs / screenshots (recommended)
      description: If you have browser console errors, command-line errors, or screenshots, paste them here or attach them.

  - type: markdown
    attributes:
      value: |
        ---
        Note: **Issues described only as "doesn't work" or "it's broken" are considered invalid and may be closed directly by the bot or maintainers.**
